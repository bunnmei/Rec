# タグ（例: v0.1.0）を push すると、各OS向けのインストーラーを作って
# GitHub の Releases に「下書き」として置きます。確認してから公開してください。
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            rust-targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - name: Windows (64bit)
            os: windows-latest
            rust-targets: ""
            args: --bundles msi,nsis
          - name: Linux (deb / rpm)
            os: ubuntu-22.04
            rust-targets: ""
            args: --bundles deb,rpm

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux 用のライブラリを入れる
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple の開発者証明書を Secrets に登録すると、署名・公証された dmg になります（任意）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "レコード録音 v__VERSION__"
          releaseBody: |
            ## ダウンロード
            - **Mac（M1 以降）**: `RecordToCD_*_aarch64.dmg`
            - **Windows（64bit）**: `RecordToCD_*_x64-setup.exe`（おすすめ）または `.msi`
            - **Linux（Ubuntu・Debian など）**: `RecordToCD_*_amd64.deb`
            - **Linux（Fedora など）**: `RecordToCD-*.x86_64.rpm`

            初めて開くときの手順は README をご覧ください。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
